name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03:00 UTC
  workflow_dispatch: {}   # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gera o snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: levyespigue14-ux
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0d1117&color_dots=#ebedf0,#c6c6c6,#8b949e,#57606a,#24292f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#30363d,#6e7681,#b1bac4,#ffffff

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
